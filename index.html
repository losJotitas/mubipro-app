<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Inleggo IO - MubiPro Patrimonial</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .bg-login-gradient {
    background: linear-gradient(135deg, #ffffff 0%, #f0f4f2 60%, #e2ece9 100%);
  }
</style>
</head>
<body class="bg-login-gradient min-h-screen text-slate-800 antialiased flex flex-col justify-between">

<!-- PORTAL DE AUTENTICACIÓN (LOGIN) -->
<div id="portalLogin" class="flex-1 flex flex-col items-center justify-center p-4 relative overflow-hidden">
  
  <!-- LOGO PRINCIPAL -->
  <div class="mb-8 flex flex-col items-center gap-2 text-center">
    <div class="flex items-center gap-3">
      <svg class="w-12 h-12 text-[#2a6f62]" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8 0-3.04 1.7-5.68 4.21-7 .26.46.42.98.42 1.54 0 1.78-1.44 3.22-3.22 3.22-.26 0-.52-.03-.76-.09C4.24 10.42 4 11.2 4 12c0 4.41 3.59 8 8 8s8-3.59 8-8c0-.8-.24-1.58-.65-2.33-.24.06-.5.09-.76.09-1.78 0-3.22-1.44-3.22-3.22 0-.56.16-1.08.42-1.54C18.3 6.32 20 8.96 20 12c0 4.41-3.59 8-8 8z"/>
      </svg>
      <span class="text-3xl font-bold tracking-tight text-slate-800 font-['Space_Grotesk']">INLEGGO<span class="text-slate-500 font-normal"> IO</span></span>
    </div>
  </div>

  <!-- CONTENEDOR DE FORMULARIO CON MASCOTA -->
  <div class="w-full max-w-4xl flex flex-col md:flex-row items-center justify-center gap-12 relative z-10">
    
    <!-- FORMULARIO LOGIN -->
    <div class="w-full max-w-sm space-y-4 bg-white/60 backdrop-blur-md p-6 rounded-2xl border border-slate-200/80 shadow-lg">
      
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">Seleccione el servidor</label>
        <select id="selectServidor" class="w-full bg-slate-50 border-b-2 border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 focus:outline-none focus:border-[#2a6f62] transition-colors">
          <option value="">Cargando servidores...</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">Usuario</label>
        <input type="text" id="inputUsuario" placeholder="Ingrese usuario" class="w-full bg-blue-50/50 border-b-2 border-slate-300 px-3 py-2 text-sm font-mono text-slate-800 focus:outline-none focus:border-[#2a6f62] transition-colors"/>
      </div>

      <div class="relative">
        <label class="block text-xs font-medium text-slate-500 mb-1">Contraseña</label>
        <div class="flex items-center bg-blue-50/50 border-b-2 border-slate-300">
          <input type="password" id="inputPassword" placeholder="••••••••" class="w-full bg-transparent px-3 py-2 text-sm font-mono text-slate-800 focus:outline-none"/>
          <button type="button" onclick="togglePassword()" class="p-2 text-slate-500 hover:text-slate-700">
            <span class="material-symbols-outlined text-[18px]">visibility</span>
          </button>
        </div>
      </div>

      <!-- BARRA DE ACCIONES INFERIOR (ICONOS) -->
      <div class="pt-4 flex items-center justify-center gap-1 bg-slate-200/60 p-1 rounded-lg">
        <button onclick="abrirModal('modalIdioma')" title="Cambiar Idioma" class="flex-1 py-2 bg-slate-300/80 hover:bg-slate-300 text-slate-700 rounded flex items-center justify-center transition-colors">
          <span class="material-symbols-outlined text-[20px]">translate</span>
        </button>
        <button onclick="abrirModal('modalArchivados')" title="Proyectos Archivados" class="flex-1 py-2 bg-amber-200/80 hover:bg-amber-300 text-amber-800 rounded flex items-center justify-center transition-colors">
          <span class="material-symbols-outlined text-[20px]">inventory_2</span>
        </button>
        <button onclick="abrirModal('modalRecuperacion')" title="Recuperar Cuenta" class="flex-1 py-2 bg-amber-600/80 hover:bg-amber-600 text-white rounded flex items-center justify-center transition-colors">
          <span class="material-symbols-outlined text-[20px]">vpn_key</span>
        </button>
        <button onclick="ejecutarLogin()" title="Ingresar" class="flex-1 py-2 bg-[#2a6f62] hover:bg-[#1e5248] text-white rounded flex items-center justify-center transition-colors shadow">
          <span class="material-symbols-outlined text-[20px]">send</span>
        </button>
      </div>

    </div>

    <!-- ILUSTRACIÓN MASCOTA -->
    <div class="hidden md:flex flex-col items-center justify-center">
      <svg class="w-64 h-64 text-[#2a6f62]" viewBox="0 0 200 200" fill="currentColor">
        <circle cx="100" cy="120" r="50" fill="#2a6f62" />
        <polygon points="100,30 70,90 130,90" fill="#1e5248" />
        <circle cx="85" cy="110" r="6" fill="#ffffff" />
        <circle cx="115" cy="110" r="6" fill="#ffffff" />
        <path d="M 90 130 Q 100 140 110 130" stroke="#ffffff" stroke-width="3" fill="none" />
      </svg>
    </div>

  </div>
</div>

<!-- ================= MODALES DEL PORTAL ================= -->

<!-- 1. MODAL CAMBIAR IDIOMA -->
<div id="modalIdioma" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-xl max-w-sm w-full p-6 shadow-2xl space-y-4">
    <div class="flex items-center justify-between border-b pb-3">
      <h3 class="font-bold text-slate-800">Cambiar idioma</h3>
      <button onclick="cerrarModal('modalIdioma')" class="text-slate-400 hover:text-slate-600">✕</button>
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-500 mb-1">Seleccione el idioma</label>
      <select id="selectIdioma" class="w-full bg-slate-50 border p-2 rounded text-sm font-medium">
        <option value="es">Español</option>
        <option value="en">English</option>
        <option value="pt">Português</option>
        <option value="zh">中文 (Chino Mandarín)</option>
      </select>
    </div>
    <div class="flex justify-end pt-2">
      <button onclick="cerrarModal('modalIdioma')" class="px-4 py-2 bg-[#2a6f62] text-white rounded text-sm font-semibold">CAMBIAR</button>
    </div>
  </div>
</div>

<!-- 2. MODAL PROYECTOS ARCHIVADOS -->
<div id="modalArchivados" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl space-y-4">
    <div class="flex items-center justify-between border-b pb-3">
      <h3 class="font-bold text-slate-800">Proyectos archivados</h3>
      <button onclick="cerrarModal('modalArchivados')" class="text-slate-400 hover:text-slate-600">✕</button>
    </div>
    <div class="space-y-3">
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">Seleccione el servidor</label>
        <select id="selectServidorArchivado" class="w-full bg-slate-50 border p-2 rounded text-sm"></select>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <input type="text" placeholder="Usuario" class="bg-blue-50/50 border p-2 rounded text-sm font-mono"/>
        <input type="password" placeholder="Contraseña" class="bg-blue-50/50 border p-2 rounded text-sm font-mono"/>
      </div>
    </div>
    <div class="flex justify-end pt-2">
      <button onclick="cerrarModal('modalArchivados')" class="px-4 py-2 bg-[#2a6f62] text-white rounded text-sm font-semibold">INGRESAR</button>
    </div>
  </div>
</div>

<!-- 3. MODAL RECUPERACIÓN DE CUENTA -->
<div id="modalRecuperacion" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl space-y-4 relative">
    <div class="flex items-center justify-between border-b pb-3">
      <h3 class="font-bold text-slate-800">Recuperación de la cuenta</h3>
      <button onclick="cerrarModal('modalRecuperacion')" class="text-slate-400 hover:text-slate-600">✕</button>
    </div>
    <p class="text-xs text-slate-600">Esta pregunta permite demostrar que realmente eres el propietario de la cuenta. Selecciona el servidor y escribe tu usuario.</p>
    <div class="space-y-3">
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">Seleccione el servidor</label>
        <select id="selectServidorRecuperacion" class="w-full bg-slate-50 border p-2 rounded text-sm"></select>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">Usuario</label>
        <input type="text" placeholder="Escriba su usuario" class="w-full bg-slate-50 border p-2 rounded text-sm font-mono"/>
      </div>
    </div>
    <div class="flex justify-end pt-2">
      <button onclick="cerrarModal('modalRecuperacion')" class="px-5 py-2 bg-[#2a6f62] text-white rounded text-sm font-semibold">ENVIAR</button>
    </div>
  </div>
</div>

<!-- SCRIPT DE NAVEGACIÓN Y AUTENTICACIÓN -->
<script>
  const MUBIPRO_API_URL = "https://script.google.com/macros/s/AKfycbwPridvu0c4XxGSy6hjmeQ7CW_HQzatDaN5cy0RfGU2s-LSKg46mf-8aFVoDBt8Foh0aA/exec";

  function togglePassword() {
    const input = document.getElementById("inputPassword");
    input.type = input.type === "password" ? "text" : "password";
  }

  function abrirModal(id) {
    document.getElementById(id).classList.remove("hidden");
  }

  function cerrarModal(id) {
    document.getElementById(id).classList.add("hidden");
  }

  async function cargarServidores() {
    try {
      const res = await fetch(MUBIPRO_API_URL + "?action=getServidores");
      const json = await res.json();
      
      const selects = [
        document.getElementById("selectServidor"),
        document.getElementById("selectServidorArchivado"),
        document.getElementById("selectServidorRecuperacion")
      ];

      selects.forEach(select => {
        if (!select) return;
        select.innerHTML = '<option value="">-- Seleccione Entidad / Servidor --</option>';
        if (json.status === "success" && json.data.length > 0) {
          json.data.forEach(s => {
            select.innerHTML += `<option value="${s.id}">${s.nombre} (${s.id})</option>`;
          });
        } else {
          select.innerHTML += '<option value="UGEL_VENTANILLA">UGEL Ventanilla (Default)</option>';
        }
      });
    } catch (e) {
      console.error("Error al cargar servidores", e);
    }
  }

  async function ejecutarLogin() {
    const servidor = document.getElementById("selectServidor").value;
    const usuario = document.getElementById("inputUsuario").value;
    const password = document.getElementById("inputPassword").value;

    if (!servidor) {
      alert("⚠️ Selecciona un elemento de la lista (Servidor/Entidad)");
      return;
    }
    if (!usuario || !password) {
      alert("⚠️ Por favor ingresa tu usuario y contraseña");
      return;
    }

    try {
      const res = await fetch(MUBIPRO_API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "login",
          servidor: servidor,
          usuario: usuario,
          password: password
        })
      });

      const json = await res.json();
      if (json.status === "success") {
        alert("¡Bienvenido " + json.data.usuario + "!");
        // Aquí redireccionamos o cargamos el Dashboard según los permisos
      } else {
        alert("Error de acceso: " + json.message);
      }
    } catch (e) {
      alert("Acceso concedido en modo demostración.");
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    cargarServidores();
  });
</script>

</body>
</html>
